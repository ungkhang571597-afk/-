<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#f8faf9" />
  <title>Zillow 房源查询</title>
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="lookup.css?v=paste-query" />
  <script src="lookup.js?v=paste-query" defer></script>
</head>
<body>
  <main class="lookup">
    <h1>Zillow 房源查询</h1>
    <form class="lookup-form" id="property-lookup" novalidate>
      <label for="zpid">房源编号（ZPID）</label>
      <input id="zpid" type="text" inputmode="numeric" enterkeyhint="go" autocomplete="off" spellcheck="false" aria-describedby="zpid-error" placeholder="例如 458238121" required />
      <div class="lookup-actions">
        <button class="lookup-paste" id="paste-query" type="button" disabled>
          <img src="../assets/ui/clipboard-paste.svg" alt="" width="18" height="18" />
          粘贴查询
        </button>
        <button class="lookup-submit" type="submit" disabled>
          在 Zillow 打开
          <img src="../assets/ui/arrow-up-right.svg" alt="" width="18" height="18" />
        </button>
      </div>
      <p class="lookup-error" id="zpid-error" role="alert"></p>
    </form>
    <noscript><p class="lookup-error">请启用 JavaScript 后再查询。</p></noscript>
  </main>
</body>
</html>
